<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="yarnGrad" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#ff8b6b"/>
      <stop offset="100%" stop-color="#e0342a"/>
    </radialGradient>
  </defs>

  <!-- yarn ball -->
  <circle cx="85" cy="120" r="55" fill="url(#yarnGrad)"/>

  <!-- yarn texture strands -->
  <path d="M35,100 Q85,70 135,110" fill="none" stroke="#b32b22" stroke-width="4" stroke-linecap="round" opacity="0.45"/>
  <path d="M30,130 Q85,152 140,125" fill="none" stroke="#b32b22" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
  <path d="M42,150 Q90,176 133,146" fill="none" stroke="#b32b22" stroke-width="4" stroke-linecap="round" opacity="0.35"/>
  <path d="M55,78 Q85,95 60,158" fill="none" stroke="#b32b22" stroke-width="4" stroke-linecap="round" opacity="0.3"/>

  <!-- soft highlight -->
  <ellipse cx="63" cy="92" rx="13" ry="7" fill="#ffffff" opacity="0.3" transform="rotate(-25 63 92)"/>

  <!-- loose yarn tail -->
  <path d="M45,168 C35,178 25,178 20,190" fill="none" stroke="#e0342a" stroke-width="5" stroke-linecap="round"/>
  <circle cx="20" cy="191" r="3" fill="#e0342a"/>

  <!-- crochet hook shaft -->
  <line x1="18" y1="184" x2="152" y2="44" stroke="#d9a066" stroke-width="9" stroke-linecap="round"/>

  <!-- hook curl at the tip -->
  <path d="M152,44 A11,11 0 1 1 137,50" fill="none" stroke="#d9a066" stroke-width="9" stroke-linecap="round"/>
</svg>
